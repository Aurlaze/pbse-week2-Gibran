name: contract

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: badminton_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: badminton_booking
      PORT: 3000

      # src/config.js refuses to start without all four of these. They were
      # missing, so the service exited before the readiness check could ever
      # reach /health and every run of this job failed on a timeout.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/badminton_booking

      # Test-only values. No real authorisation server is reachable from CI,
      # and a token minted against this issuer is refused by any deployed
      # service, which is the point of Step 11a's local-key strategy.
      OIDC_ISSUER: https://test.local/
      OIDC_AUDIENCE: badminton-api
      OIDC_JWKS_URI: http://127.0.0.1:9999/jwks.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: service/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Proves schema.sql is runnable from an empty database.
      - name: Apply schema and seed
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f service/db/schema.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f service/db/seed.sql
          echo "tables created:"
          psql "$DATABASE_URL" -c '\dt'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/badminton_booking

      - name: Install service dependencies
        run: npm ci
        working-directory: service

      - name: Install schemathesis
        run: pip install schemathesis

      # Must come up before the service, which fetches this JWKS the first
      # time it has a token to verify. Also writes the token the curl steps
      # and the contract suite send, now that /v1 refuses anonymous requests.
      - name: Start the test JWKS server
        run: node tests/helpers/serve-jwks.js --port 9999 --token-out /tmp/contract-token.txt > /tmp/jwks.log 2>&1 &
        working-directory: service

      - name: Wait for the test JWKS server
        run: npx --yes wait-on http://127.0.0.1:9999/jwks.json --timeout 30000

      - name: Start the service
        run: npm start > /tmp/service.log 2>&1 &
        working-directory: service

      - name: Wait for readiness
        run: npx --yes wait-on http://localhost:3000/health --timeout 60000

      # Two identical POSTs with one key: two 201s, same body, one row.
      # Runs before the fuzzer, which posts the contract's own example body
      # and would otherwise hold this slot.
      - name: Idempotency replay
        run: |
          TOKEN=$(cat /tmp/contract-token.txt)
          KEY=$(uuidgen)
          BODY='{"courtId":"crt_51Fa93cD","startTime":"2026-08-29T19:00:00+07:00","endTime":"2026-08-29T20:00:00+07:00"}'
          for i in 1 2; do
            code=$(curl -s -o "/tmp/r$i.json" -w '%{http_code}' \
              -X POST http://localhost:3000/v1/bookings \
              -H "Authorization: Bearer $TOKEN" \
              -H "Idempotency-Key: $KEY" \
              -H 'Content-Type: application/json' \
              -d "$BODY")
            echo "attempt $i -> $code"
            [ "$code" = "201" ] || { echo "expected 201, got $code"; cat "/tmp/r$i.json"; exit 1; }
          done
          diff /tmp/r1.json /tmp/r2.json || { echo "replayed response differs"; exit 1; }
          rows=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM bookings WHERE court_id = 'crt_51Fa93cD' AND start_time = '2026-08-29T19:00:00+07:00'")
          echo "rows for that court and slot: $rows"
          [ "$rows" = "1" ] || { echo "expected exactly 1 booking row, found $rows"; exit 1; }
          echo "one key, two 201s, identical bodies, one row"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/badminton_booking

      # The contract did not change to accommodate authentication; the
      # runner did. Session 4 step 12b: operations that passed at Session 3
      # must still pass, they just have to present a token now.
      - name: Contract conformance
        run: |
          TOKEN=$(cat /tmp/contract-token.txt) bash ./tests/contract/run.sh
        env:
          BASE: http://localhost:3000/v1

      # Step 12a: the authorisation tests run on every push, in the same
      # pipeline as the contract tests, so the boundary closed in Session 4
      # cannot reopen without this job going red.
      #
      # These start their own service in-process against their own test key,
      # so they do not use the one started above.
      - name: Authorisation tests
        run: npm run test:authz
        working-directory: service

      - name: Service log
        if: always()
        run: |
          echo "=== service stdout/stderr ==="
          cat /tmp/service.log || echo "(no log captured)"
          echo "=== test JWKS server ==="
          cat /tmp/jwks.log || echo "(no log captured)"
