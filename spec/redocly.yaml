# Redocly lint configuration.
#
# The default "recommended" ruleset is written for a published, production
# API. Three of its rules do not yet apply to a Meeting 2 document, and each
# one is switched off here WITH A DATE ON WHICH IT COMES BACK. Turning a rule
# off without recording why is how a lint configuration becomes a place where
# problems go to be forgotten.

extends:
  - recommended

rules:
  # security-defined was off until Meeting 4, when there was nothing to
  # declare. Session 4 declared it: every operation now names a scope, or
  # opts out explicitly with `security: []` as /health does. The rule is
  # back on, so an operation added without a security entry is a lint
  # failure rather than a silently unprotected route.

  # no-server-example.com was off while `servers:` still held a
  # placeholder. It now names the real deployment, so the rule is back on
  # and a placeholder URL cannot reappear unnoticed.
  #
  # Note that `https://api.example.com/problems/...` still appears in the
  # document, as the `type` member of every Problem. Those are identifiers,
  # not addresses: RFC 9457 does not require a type URI to resolve, clients
  # branch on the exact string, and the compatibility policy in
  # CHANGELOG.md says a published `type` never changes. Renaming them to
  # match the deployment would break every client for no gain.

  # A licence matters for a published API. Not for a course project.
  info-license: off

  # Everything else stays on, including:
  #   no-invalid-media-type-examples — your examples must actually
  #     validate against your own schemas. This is the rule that catches
  #     a specification quietly drifting away from its examples, which is
  #     the single most common Meeting 7 complaint.
  #   operation-4xx-response — every operation documents at least one
  #     failure. Happy-paths-only is a 25% criterion in A1.
  #   operation-operationId, operation-summary, no-ambiguous-paths.
