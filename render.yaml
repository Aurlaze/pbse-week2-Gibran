# Render blueprint. Lets the service be recreated from a clean checkout
# without anyone reconstructing dashboard settings by hand.
services:
  - type: web
    name: badminton-booking-api
    runtime: node
    plan: free
    region: singapore
    rootDir: service
    buildCommand: npm ci
    startCommand: npm start
    # Render restarts the process when this stops answering, so it checks no
    # external dependency.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Set in the dashboard, never committed. Neon gives this as one string.
      - key: DATABASE_URL
        sync: false
